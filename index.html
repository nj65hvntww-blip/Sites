<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --line:#2a2e37; --text:#c9d1d9; --dim:#6b7380;
  --accent:#4cc2ff; --run:#3ddc97; --danger:#ff5d6c;
  --tag:#ff7b93; --attr:#ffc66d; --str:#8fd694; --num:#d6a5ff; --kw:#6cb6ff; --fn:#f0c674; --com:#5c6370; --prop:#7dd3fc; --cls:#ffa657;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,sans-serif;overflow:hidden;
  touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}

/* top bar */
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:9px;background:#262a33;font-weight:600;font-size:14px;white-space:nowrap}
.btn:active{background:#323744}
.btn.run{background:var(--run);color:#06281a}
.btn.ic{width:36px;padding:0;font-size:17px}

/* tabs */
.tabs{display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:40px;flex:none;font-size:14px;color:var(--dim);
  border-right:1px solid var(--line);user-select:none;-webkit-user-select:none;position:relative}
.tab.on{color:var(--text);background:#1b1e24}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.tab .x{width:26px;height:26px;border-radius:6px;font-size:16px;line-height:26px;color:var(--dim)}
.tab .x:active{background:#333}
.add{width:44px;height:40px;flex:none;font-size:22px;color:var(--accent)}

/* editor */
#ed{position:relative;flex:1;min-height:0;background:var(--bg)}
#hl,#code{position:absolute;inset:0;margin:0;padding:14px;border:0;width:100%;height:100%;
  font:15px/1.55 ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;tab-size:2;
  white-space:pre;overflow:auto;word-wrap:normal}
#hl{pointer-events:none;color:var(--text);overflow:hidden}
#code{background:transparent;color:transparent;caret-color:var(--accent);resize:none;outline:none;
  -webkit-text-fill-color:transparent;font-size:16px}
#hl{font-size:16px}
#code::selection{background:rgba(76,194,255,.3);-webkit-text-fill-color:transparent}
.t{color:var(--tag)}.a{color:var(--attr)}.s{color:var(--str)}.n{color:var(--num)}
.k{color:var(--kw)}.f{color:var(--fn)}.c{color:var(--com);font-style:italic}.p{color:var(--prop)}.l{color:var(--cls)}.d{color:var(--dim)}

/* preview */
#pv{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);flex-direction:column;
  padding:env(safe-area-inset-top) 0 0}
#pv.open{display:flex}
#pv iframe{flex:1;width:100%;border:0;background:#000;margin-bottom:env(safe-area-inset-bottom)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#2b303b;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="btn run" id="run">▶ Run</button>
    <span class="sp"></span>
    <button class="btn" id="imp">Import</button>
    <button class="btn" id="save">Export</button>
    <input type="file" id="file" accept=".html,.htm,.css,.js,.txt,text/*" hidden>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="ed">
    <pre id="hl" aria-hidden="true"></pre>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" placeholder="Type your HTML here…"></textarea>
  </div>
</div>
<div id="pv">
  <div class="bar"><button class="btn" id="back" style="background:var(--danger)">‹ Editor</button></div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
</div>
<div id="toast"></div>

<script>
(function(){
var KEY='codeeditor.v1';
var DEFAULT='<h1>Ready to Code!</h1>\n<p>Your editor is ready. 🤩</p>\n<style>\n  body { background: #000; color: #34c759; text-align: center; padding-top: 50px; }\n</style>\n';
var $=function(i){return document.getElementById(i)};
var code=$('code'),hl=$('hl'),tabsEl=$('tabs');
var st=load();

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tabs&&s.tabs.length)return s}catch(e){}
  return {tabs:[{id:1,name:'index.html',code:DEFAULT}],active:1,next:2};
}
var saveT;
function persist(now){
  clearTimeout(saveT);
  var go=function(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
  now?go():saveT=setTimeout(go,300);
}
function cur(){return st.tabs.filter(function(t){return t.id===st.active})[0]||st.tabs[0]}

/* ---------- syntax highlighting ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function span(c,s){return '<span class="'+c+'">'+esc(s)+'</span>'}
function tok(src,re,fn){
  var out='',last=0,m;re.lastIndex=0;
  while((m=re.exec(src))){
    if(m[0]==='')break;
    out+=esc(src.slice(last,m.index))+fn(m);last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
var JSKW='break|case|catch|class|const|continue|default|delete|do|else|export|extends|finally|for|function|if|import|in|instanceof|let|new|null|of|return|super|switch|this|throw|try|typeof|undefined|var|void|while|async|await|true|false|yield';
var jsRe=new RegExp('\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?(?:\\*\\/|$)|`(?:\\\\[\\s\\S]|[^`\\\\])*`?|"(?:\\\\.|[^"\\\\\\n])*"?|\'(?:\\\\.|[^\'\\\\\\n])*\'?|\\b(?:'+JSKW+')\\b|\\b\\d+\\.?\\d*\\b|[A-Za-z_$][\\w$]*(?=\\()','g');
function hlJS(s){
  return tok(s,jsRe,function(m){
    var t=m[0],c=t[0];
    if(t.slice(0,2)==='//'||t.slice(0,2)==='/*')return span('c',t);
    if(c==='"'||c==="'"||c==='`')return span('s',t);
    if(/^\d/.test(t))return span('n',t);
    if(new RegExp('^(?:'+JSKW+')$').test(t))return span('k',t);
    return span('f',t);
  });
}
var cssRe=/\/\*[\s\S]*?(?:\*\/|$)|"[^"\n]*"?|'[^'\n]*'?|#[0-9a-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr)?\b|@[\w-]+|[.#][\w-]+|[\w-]+(?=\s*:(?!:))/g;
function hlCSS(s){
  return tok(s,cssRe,function(m){
    var t=m[0],c=t[0];
    if(t.slice(0,2)==='/*')return span('c',t);
    if(c==='"'||c==="'")return span('s',t);
    if(c==='#'&&/^#[0-9a-fA-F]{3,8}$/.test(t))return span('n',t);
    if(c==='@')return span('k',t);
    if(c==='.'&&!/^\.\d/.test(t)||c==='#')return span('l',t);
    if(/^[-\d.]/.test(t))return span('n',t);
    return span('p',t);
  });
}
var attrRe=/([^\s=\/>"']+)(\s*=\s*)?("[^"]*"?|'[^']*'?|[^\s"'>]+)?/g;
function hlTag(t){
  var m=/^(<\/?)([^\s>\/]+)([\s\S]*?)(\/?>?)$/.exec(t);
  if(!m)return esc(t);
  var out=span('d',m[1])+span('t',m[2]);
  out+=tok(m[3],attrRe,function(a){
    return span('a',a[1])+(a[2]?span('d',a[2]):'')+(a[3]?span('s',a[3]):'');
  });
  return out+span('d',m[4]);
}
var htmlRe=/<!--[\s\S]*?(?:-->|$)|<!DOCTYPE[^>]*>?|<(style|script)\b[^>]*>[\s\S]*?(?:<\/\1\s*>|$)|<\/?[a-zA-Z][^>]*>?|&#?\w+;/gi;
function hlHTML(s){
  return tok(s,htmlRe,function(m){
    var t=m[0];
    if(t.slice(0,4)==='<!--')return span('c',t);
    if(/^<!doctype/i.test(t))return span('d',t);
    if(t[0]==='&')return span('n',t);
    if(m[1]){
      var o=/^(<[^>]*>)([\s\S]*?)(<\/[^>]*>?)?$/.exec(t);
      var inner=m[1].toLowerCase()==='style'?hlCSS(o[2]):hlJS(o[2]);
      return hlTag(o[1])+inner+(o[3]?hlTag(o[3]):'');
    }
    return hlTag(t);
  });
}
function paint(){
  hl.innerHTML=hlHTML(code.value)+'\n';
  hl.scrollTop=code.scrollTop;hl.scrollLeft=code.scrollLeft;
}

/* ---------- tabs ---------- */
function renderTabs(){
  tabsEl.innerHTML='';
  st.tabs.forEach(function(t){
    var d=document.createElement('div');
    d.className='tab'+(t.id===st.active?' on':'');
    var n=document.createElement('span');n.textContent=t.name;d.appendChild(n);
    var x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Close '+t.name);
    x.onclick=function(e){e.stopPropagation();closeTab(t.id)};
    d.appendChild(x);
    d.onclick=function(){if(t.id!==st.active)switchTab(t.id);else rename(t)};
    tabsEl.appendChild(d);
  });
  var a=document.createElement('button');a.className='add';a.textContent='+';a.setAttribute('aria-label','New tab');
  a.onclick=addTab;tabsEl.appendChild(a);
  var on=tabsEl.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'nearest',block:'nearest'});
}
function syncCur(){cur().code=code.value}
function switchTab(id){syncCur();st.active=id;show();persist(true)}
function addTab(){
  syncCur();
  var id=st.next++;
  st.tabs.push({id:id,name:'file'+id+'.html',code:''});
  st.active=id;show();persist(true);code.focus();
}
function closeTab(id){
  var t=st.tabs.filter(function(x){return x.id===id})[0];
  if(t.code.trim()&&!confirm('Close "'+t.name+'"?'))return;
  var i=st.tabs.indexOf(t);st.tabs.splice(i,1);
  if(!st.tabs.length){st.tabs.push({id:st.next++,name:'index.html',code:''})}
  if(st.active===id)st.active=st.tabs[Math.max(0,i-1)].id;
  show();persist(true);
}
function rename(t){
  var n=prompt('Rename tab',t.name);
  if(n&&n.trim()){t.name=n.trim();renderTabs();persist(true)}
}
function show(){code.value=cur().code;paint();renderTabs();code.scrollTop=code.scrollLeft=0;hl.scrollTop=hl.scrollLeft=0}

/* ---------- editor events ---------- */
code.addEventListener('input',function(){cur().code=code.value;paint();persist()});
code.addEventListener('scroll',function(){hl.scrollTop=code.scrollTop;hl.scrollLeft=code.scrollLeft});
code.addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    var s=code.selectionStart,en=code.selectionEnd;
    code.value=code.value.slice(0,s)+'  '+code.value.slice(en);
    code.selectionStart=code.selectionEnd=s+2;
    code.dispatchEvent(new Event('input'));
  }
});

/* ---------- run / preview ---------- */
$('run').onclick=function(){
  syncCur();persist(true);
  $('frame').srcdoc='<style>body{background:#000;color:#fff;font-family:sans-serif}</style>'+code.value;
  $('pv').classList.add('open');
};
$('back').onclick=function(){$('pv').classList.remove('open');$('frame').srcdoc=''};

/* ---------- import / export ---------- */
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    syncCur();
    var id=st.next++;
    st.tabs.push({id:id,name:f.name,code:String(e.target.result)});
    st.active=id;show();persist(true);
  };
  r.readAsText(f);this.value='';
};
$('save').onclick=function(){
  syncCur();var t=cur();
  var name=/\.\w+$/.test(t.name)?t.name:t.name+'.html';
  var blob=new Blob([t.code],{type:'text/html'});
  try{
    var file=new File([blob],name,{type:'text/html'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return}
  }catch(e){}
  var a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click();
  toast('Exported '+name);
};
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

/* ---------- no zoom ---------- */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev,function(e){e.preventDefault()});
});
var lastTouch=0;
document.addEventListener('touchend',function(e){
  var now=Date.now();
  if(now-lastTouch<350&&e.target.tagName!=='TEXTAREA')e.preventDefault();
  lastTouch=now;
},{passive:false});

/* ---------- save on leave + iOS icon ---------- */
function flush(){syncCur();persist(true)}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});
window.addEventListener('pagehide',flush);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});

show();
})();
</script>
</body>
