<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1,
                   viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Iphone App!">

    <meta name="theme-color" content="#0b0b0f">
    <link rel="apple-touch-icon"
      href="https://images.icon-icons.com/1381/PNG/512/minecraft_94415.png">

    <title>Just documentation</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            /* Use dvh (Dynamic Viewport Height) to handle Safari bars */
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #camera-section {
            flex: 1; /* This takes up all available space above the panel */
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Fixed Bottom Panel */
        .bottom-panel {
            height: 140px; /* Specific height for buttons */
            background: #000;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom); /* Fix for iPhone Home Bar */
            z-index: 100;
            border-top: 1px solid #222;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 10px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            width: 42%; /* Makes buttons fit side-by-side perfectly */
            text-align: center;
            -webkit-appearance: none;
        }

        .btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        #status-pill {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="camera-section">
        <div id="status-pill">Ready to start</div>
        <video id="video" autoplay muted playsinline webkit-playsinline></video>
    </div>

    <div class="bottom-panel">
        <button class="btn btn-secondary" id="switch-btn">Switch Camera</button>
        <button class="btn" id="start-btn">Start Testing</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const switchBtn = document.getElementById('switch-btn');
        const status = document.getElementById('status-pill');

        let stream = null;
        let isFront = false;

        async function launch() {
            if (stream) stream.getTracks().forEach(t => t.stop());

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: isFront ? "user" : "environment" }
                });
                video.srcObject = stream;
                video.play();
                status.innerText = "Active: " + (isFront ? "Front" : "Back");
                startBtn.innerText = "Running...";
            } catch (err) {
                status.innerText = "Error: Allow Camera Access";
            }
        }

        // Prevent iOS from freezing the stream
        video.addEventListener('pause', () => { if(stream) video.play(); });

        startBtn.addEventListener('click', launch);
        switchBtn.addEventListener('click', () => {
            isFront = !isFront;
            launch();
        });

        // Stops the screen from bouncing up and down
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
