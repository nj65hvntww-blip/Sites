<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1f22"><title>Discord Webhook Hub</title>
<style>
:root{--bg:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--bg4:#383a40;--tx:#f2f3f5;--mu:#949ba4;--ac:#5865f2;--ac2:#4752c4;--ok:#23a559;--er:#f23f43;--bd:#3f4147;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:16px 14px 100px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;font:inherit;outline:none;min-height:48px}
input:focus,textarea:focus{border-color:var(--ac)}textarea{resize:vertical;min-height:90px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:48px;padding:0 18px;background:var(--ac);color:#fff;cursor:pointer;transition:transform .1s,background .2s}
button:active{transform:scale(.97)}button:hover{background:var(--ac2)}button:disabled{opacity:.5}
button.g{background:var(--bg4)}button.d{background:var(--er)}button.w{width:100%;margin-top:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.s{flex:none}
.av{width:44px;height:44px;border-radius:50%;background:var(--ac);flex:none;object-fit:cover;display:grid;place-items:center;font-weight:700}
.pv{display:flex;gap:12px;background:var(--bg3);border-radius:12px;padding:12px;align-items:flex-start}
.pv b{display:block}.tag{font-size:10px;background:var(--ac);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.mu{color:var(--mu);font-size:13px}.wh{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--bg3);margin-bottom:8px;border:2px solid transparent}
.wh.on{border-color:var(--ac)}.wh .i{flex:1;min-width:0}.wh .i div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{background:#4a3b12;color:#f0c75a;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);display:flex;flex-direction:column;gap:2px;font-size:11px;min-height:54px;padding:0}
nav button span{font-size:22px}nav button.on{color:#fff;background:var(--bg3)}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.t{background:var(--ok);padding:12px 14px;border-radius:12px;font-weight:600;animation:in .25s;box-shadow:0 6px 20px #0006}.t.e{background:var(--er)}
#off{display:none;background:var(--er);padding:10px 14px;text-align:center;font-size:14px}#off.show{display:flex;gap:10px;justify-content:center;align-items:center}
#off button{min-height:32px;padding:0 12px;background:#0004}
.bar{height:6px;background:var(--bg);border-radius:3px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:15;padding:0}
.modal>div{background:var(--bg2);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:in .25s}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;min-height:40px;background:var(--bg4)}.tabs button.on{background:var(--ac)}
.ed{display:grid;gap:10px}.code{font:14px/1.5 ui-monospace,Menlo,monospace;min-height:48vh;white-space:pre;tab-size:2}
.ro{font:12px ui-monospace,Menlo,monospace;color:var(--mu);background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:8px;margin-bottom:6px;overflow-x:auto;white-space:pre}
iframe{width:100%;height:60vh;border:1px solid var(--bd);border-radius:12px;background:#fff}
.hide{display:none!important}
@media(min-width:900px){#app.wide{max-width:1200px}.ed{grid-template-columns:1fr 1fr}.ed .tg{display:none}.ed .pane{display:block!important}iframe{height:72vh}}
</style></head><body>
<div id="off">Немає з’єднання. Спробуйте ще раз <button id="retry">Спробувати ще раз</button></div>
<div id="toast"></div><div id="app"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('dwh.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('dwh.'+k,JSON.stringify(v))}catch(e){toast('Не вдалося зберегти локально',1)}}};
const S={tab:'wh',hooks:LS.get('hooks',[]),sel:LS.get('sel',null),code:LS.get('code',{html:'<h1>Привіт!</h1>\n<button id="b">Надіслати у Discord</button>',css:'body{font-family:sans-serif;background:#1e1f22;color:#fff;padding:20px}\nbutton{padding:12px 18px;border:0;border-radius:10px;background:#5865f2;color:#fff;font-size:16px}',js:'document.getElementById("b").onclick=async()=>{\n  const r=await fetch(webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:"Привіт з коду!",username:nickname||undefined,avatar_url:avatarUrl||undefined})});\n  alert(r.ok?"Надіслано":"Помилка "+r.status);\n};'}),
 file:'html',view:'code',codeHook:null,lastId:'',prog:null,busy:{},D:{},editing:null,ran:0};
const D=S.D;
const save=()=>{LS.set('hooks',S.hooks);LS.set('sel',S.sel);LS.set('code',S.code)};
const active=()=>S.hooks.find(h=>h.id===S.sel)||null;
const hookRe=/^https:\/\/(?:(?:ptb|canary)\.)?discord(?:app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/;
function toast(m,err){const t=document.createElement('div');t.className='t'+(err?' e':'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),err?5000:2600)}
function netErr(e){return e&&e.name==='TypeError'?'Браузер заблокував запит (CORS) або немає мережі. Для таких дій може знадобитися проксі-бекенд.':'Помилка: '+(e&&e.message||e)}
async function apiErr(r){let t='';try{const j=await r.json();t=j.message||''}catch(e){}return `Discord відповів ${r.status}${t?': '+t:''}`}
const avatar=(h,u)=>{const src=u||h&&h.avatar;return src?`<img class="av" src="${esc(src)}" alt="" onerror="this.outerHTML='<div class=\\'av\\'>${esc((h&&h.nick||h&&h.name||'?')[0]||'?')}</div>'">`:`<div class="av">${esc(((h&&(h.nick||h.name))||'?')[0])}</div>`};
const preview=h=>`<div class="pv">${avatar(h)}<div><b>${esc(h.nick||h.name)}<span class="tag">WEBHOOK</span></b><div class="mu">${esc(h.desc||'Без опису')}</div></div></div>`;
const secret='<div class="warn">🔒 Webhook URL — це секретне посилання. Не публікуйте його.</div>';
const inp=(k,l,o={})=>`<label>${l}</label>${o.ta?`<textarea data-k="${k}" placeholder="${o.p||''}">${esc(D[k]||'')}</textarea>`:`<input data-k="${k}" ${o.type?`type="${o.type}"`:''} placeholder="${o.p||''}" inputmode="${o.im||'text'}" value="${esc(D[k]||'')}" autocomplete="off">`}`;

/* ---------- views ---------- */
function vWh(){const a=active();
 let h='<h1>Webhooks</h1>'+secret;
 if(!S.hooks.length)return h+`<div class="card" style="text-align:center"><p class="mu">У вас ще немає Webhook</p><button class="w" data-a="new">Створити Webhook</button></div>`;
 if(a)h+=`<div class="card"><h2>Активний webhook</h2>${preview(a)}</div>`;
 h+=S.hooks.map(w=>`<div class="wh ${w.id===S.sel?'on':''}">${avatar(w)}<div class="i"><b>${esc(w.name)}</b><div class="mu">${esc(w.nick||'—')}</div></div><button class="s ${w.id===S.sel?'':'g'}" data-a="pick" data-id="${w.id}">${w.id===S.sel?'✓':'Вибрати'}</button><button class="s g" data-a="edit" data-id="${w.id}">✎</button><button class="s d" data-a="del" data-id="${w.id}">🗑</button></div>`).join('');
 return h+'<button class="w" data-a="new">＋ Створити Webhook</button>'}
function modalWh(){const w=S.editing;if(!w)return'';return `<div class="modal" data-a="mclose"><div onclick="event.stopPropagation()"><h1>${w.id?'Редагувати':'Новий'} webhook</h1>
 ${inp('f_name','Назва webhook',{p:'Мій сервер'})}${inp('f_url','Discord Webhook URL',{p:'https://discord.com/api/webhooks/…',type:'url',im:'url'})}${inp('f_nick','Нікнейм')}${inp('f_avatar','Avatar URL',{type:'url',im:'url'})}${inp('f_desc','Опис',{ta:1})}
 ${secret}<div class="row"><button class="g" data-a="mclose">Скасувати</button><button data-a="msave">Зберегти</button></div></div></div>`}
function noHook(){return `<div class="card" style="text-align:center"><p class="mu">У вас ще немає Webhook</p><button class="w" data-a="new">Створити Webhook</button></div>`}
function head(){const a=active();return `<div class="card"><h2>Активний Webhook</h2>${preview(a)}<div class="mu" style="margin-top:6px">${esc(a.name)}</div></div>`}
function vMsg(){const a=active();let h='<h1>Повідомлення</h1>';
 if(!a)return h+noHook();
 h+=head();
 if(S.lastId)h+=`<div class="warn" style="background:#173d27;color:#7ee2a8">Останній ID: <b>${esc(S.lastId)}</b> <button class="g" style="min-height:32px;padding:0 10px;margin-left:6px" data-a="useid">Використати</button></div>`;
 const bz=k=>S.busy[k]?'disabled':'';
 h+=`<div class="card"><h2>Надіслати повідомлення</h2>${inp('m_text','Текст повідомлення',{ta:1})}${inp('m_user','Ім’я (необов’язково)')}${inp('m_av','Avatar URL (необов’язково)',{type:'url',im:'url'})}
 <label>Файл (необов’язково)</label><input type="file" id="f_send">
 <button class="w" data-a="send" ${bz('send')}>${S.busy.send?'Надсилання…':'Відправити'}</button>${S.prog&&S.prog.k==='send'?`<div class="bar"><i style="width:${S.prog.p}%"></i></div>`:''}</div>
 <div class="card"><h2>Редагувати повідомлення</h2><p class="mu" style="margin:0">Введіть ID повідомлення, надісланого цим webhook (не ID webhook).</p>${inp('e_id','ID повідомлення',{im:'numeric',p:'напр. 1234567890123456789'})}${inp('e_text','Новий текст повідомлення',{ta:1})}
 <button class="w" data-a="edit_msg" ${bz('edit')}>Змінити повідомлення</button></div>
 <div class="card"><h2>Видалити повідомлення</h2>${inp('d_id','ID повідомлення',{im:'numeric'})}<button class="w d" data-a="del_msg" ${bz('del')}>Видалити</button></div>
 <div class="card"><h2>Відправити фото</h2>${inp('i_url','Image URL',{type:'url',im:'url',p:'https://…/image.png'})}<div class="mu" style="text-align:center;margin-top:8px">АБО</div>
 <label>Обрати фото</label><input type="file" id="f_img" accept="image/*">${inp('i_text','Текст (необов’язково)')}
 <button class="w" data-a="send_img" ${bz('img')}>${S.busy.img?'Надсилання…':'Відправити фото'}</button>${S.prog&&S.prog.k==='img'?`<div class="bar"><i style="width:${S.prog.p}%"></i></div>`:''}</div>`;
 return h}
function vCode(){let h='<h1>Код</h1>';
 if(!S.hooks.length)return h+noHook();
 const w=S.hooks.find(x=>x.id===S.codeHook);
 if(!w)return h+'<div class="card"><h2>Оберіть webhook</h2>'+S.hooks.map(x=>`<div class="wh">${avatar(x)}<div class="i"><b>${esc(x.name)}</b></div><button class="s" data-a="codepick" data-id="${x.id}">Обрати</button></div>`).join('')+'</div>';
 const f=S.file,fn={html:'index.html',css:'style.css',js:'script.js'};
 const ro=f==='js'?`<div class="ro">${esc(cfgLines(w))}</div>`:'';
 h+=`<div class="row" style="margin-bottom:10px"><div class="mu">Webhook: <b style="color:#fff">${esc(w.name)}</b></div><button class="g s" data-a="codechange" style="min-height:40px">Змінити</button></div>
 <div class="tabs tg"><button class="${S.view==='code'?'on':''}" data-a="vcode">Code</button><button class="${S.view==='prev'?'on':''}" data-a="vprev">Preview</button></div>
 <div class="ed"><div class="pane ${S.view==='code'?'':'hide'}"><div class="tabs">${Object.keys(fn).map(k=>`<button class="${k===f?'on':''}" data-a="file" data-id="${k}">${fn[k]}</button>`).join('')}</div>${ro}
 <textarea class="code" id="codeta" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(S.code[f])}</textarea>
 <div class="row" style="margin-top:8px"><button data-a="run">▶ Run</button><button class="g" data-a="csave">Save</button><button class="g" data-a="cclear">Clear</button><button class="g" data-a="vprev2">Preview</button></div></div>
 <div class="pane ${S.view==='prev'?'':'hide'}"><iframe id="pf" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="Preview"></iframe></div></div>`;
 return h}
function vSet(){return `<h1>Налаштування</h1>${secret}<div class="card"><h2>Дані</h2><p class="mu" style="margin:0 0 8px">Усе зберігається лише у цьому браузері. Дані webhook не надсилаються на сторонні сервери — запити йдуть напряму до Discord.</p>
 <div class="row"><button class="g" data-a="export">Експорт JSON</button><button class="d" data-a="wipe">Стерти все</button></div></div>
 <div class="card"><h2>Про додаток</h2><p class="mu" style="margin:0">Це керування <b>webhook</b>, а не Discord-бот. Якщо браузер блокує запит (CORS), ви побачите чітку помилку — фальшивих «успішних» відповідей немає. Для обмежених дій можна додати власний проксі, змінивши <code>API_BASE</code> у коді.</p>
 <p class="mu">PWA: у Safari натисніть «Поділитися» → «На екран Додому».</p></div>`}

/* ---------- render ---------- */
function codeSync(){const t=$('#codeta');if(t)S.code[S.file]=t.value}
function render(){
 try{codeSync();const V={wh:vWh,msg:vMsg,code:vCode,set:vSet}[S.tab];
 $('#app').className=S.tab==='code'?'wide':'';
 $('#app').innerHTML=V()+modalWh();
 $('#nav').innerHTML=[['wh','🔗','Webhooks'],['msg','💬','Messages'],['code','🧩','Code'],['set','⚙️','Settings']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-id="${k}"><span>${i}</span>${l}</button>`).join('');
 if(S.tab==='code'&&S.codeHook)runPreview()}
 catch(e){fatal(e)}}
function fatal(e){$('#app').innerHTML=`<div class="card"><h1>Щось пішло не так</h1><p class="mu">${esc(e&&e.message||e)}</p><button class="w" onclick="location.reload()">Перезавантажити</button><button class="w g" id="rs">Скинути екран</button></div>`;const b=$('#rs');if(b)b.onclick=()=>{S.tab='wh';S.editing=null;render()}}
window.addEventListener('error',e=>{if(!$('#app').innerHTML.trim())fatal(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>toast(netErr(e.reason),1));

/* ---------- code preview ---------- */
const safeJs=s=>JSON.stringify(s??'').replace(/</g,'\\u003c');
function cfgLines(w){return `const webhookUrl = ${JSON.stringify(w.url)};\nconst avatarUrl = ${JSON.stringify(w.avatar||'')};\nconst nickname = ${JSON.stringify(w.nick||'')};`}
function runPreview(){const w=S.hooks.find(x=>x.id===S.codeHook),f=$('#pf');if(!w||!f)return;
 const c=S.code,cfg=`const webhookUrl=${safeJs(w.url)};const avatarUrl=${safeJs(w.avatar||'')};const nickname=${safeJs(w.nick||'')};`;
 const guard=`<script>(function(){function show(m){var d=document.createElement('pre');d.style.cssText='position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px;background:#f23f43;color:#fff;font:13px monospace;white-space:pre-wrap;z-index:99999';d.textContent='⚠ '+m;document.body.appendChild(d)}window.addEventListener('error',function(e){show(e.message+(e.lineno?' (рядок '+e.lineno+')':''))});window.addEventListener('unhandledrejection',function(e){show('Promise: '+(e.reason&&e.reason.message||e.reason))})})()<\/script>`;
 f.srcdoc=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${c.css.replace(/<\/style/gi,'<\\/style')}</style></head><body>${c.html}${guard}<script>${cfg}<\/script><script>${c.js.replace(/<\/script/gi,'<\\/script')}<\/script></body></html>`}

/* ---------- discord api ---------- */
const API_BASE='';// порожньо = напряму до Discord; сюди можна підставити власний проксі
const target=(w,id)=>{const u=API_BASE?API_BASE+encodeURIComponent(w.url):w.url;return id?w.url+'/messages/'+id:w.url};
const need=()=>{if(!navigator.onLine){toast('Немає з’єднання. Спробуйте ще раз',1);return null}const a=active();if(!a)toast('Спершу оберіть webhook',1);return a};
const idOk=v=>/^\d{5,25}$/.test(v||'');
function xhrSend(url,fd,k){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',url);x.upload.onprogress=e=>{if(e.lengthComputable){S.prog={k,p:Math.round(e.loaded/e.total*100)};const b=document.querySelector('.bar i');if(b)b.style.width=S.prog.p+'%'}};
 x.onload=()=>{let j=null;try{j=JSON.parse(x.responseText)}catch(e){}x.status>=200&&x.status<300?res(j||{}):rej(new Error(`Discord відповів ${x.status}${j&&j.message?': '+j.message:''}`))};
 x.onerror=()=>rej(new TypeError('network'));x.send(fd)})}
async function act(k,fn){S.busy[k]=1;S.prog=null;render();try{await fn()}catch(e){toast(e instanceof TypeError?netErr(e):(e.message||String(e)),1)}S.busy[k]=0;S.prog=null;render()}
const ACT={
 tab(id){S.tab=id;render()},
 new(){S.editing={};D.f_name=D.f_url=D.f_nick=D.f_avatar=D.f_desc='';render()},
 edit(id){const w=S.hooks.find(x=>x.id===id);S.editing=w;D.f_name=w.name;D.f_url=w.url;D.f_nick=w.nick;D.f_avatar=w.avatar;D.f_desc=w.desc;render()},
 mclose(){S.editing=null;render()},
 msave(){const n=(D.f_name||'').trim(),u=(D.f_url||'').trim();
  if(!n)return toast('Вкажіть назву',1);if(!hookRe.test(u))return toast('Некоректний Webhook URL. Очікується https://discord.com/api/webhooks/ID/TOKEN',1);
  const av=(D.f_avatar||'').trim();if(av&&!/^https?:\/\//i.test(av))return toast('Avatar URL має починатися з http(s)://',1);
  const o={name:n,url:u,nick:(D.f_nick||'').trim(),avatar:av,desc:(D.f_desc||'').trim()};
  if(S.editing.id)Object.assign(S.editing,o);else{o.id='w'+Date.now();S.hooks.push(o);if(!S.sel)S.sel=o.id}
  S.editing=null;save();toast('Webhook збережено');render()},
 pick(id){S.sel=id;save();render()},
 del(id){if(!confirm('Видалити цей webhook?'))return;S.hooks=S.hooks.filter(x=>x.id!==id);if(S.sel===id)S.sel=S.hooks[0]?.id||null;if(S.codeHook===id)S.codeHook=null;save();render()},
 useid(){D.e_id=D.d_id=S.lastId;render()},
 send(){const a=need();if(!a)return;const t=(D.m_text||'').trim(),f=$('#f_send')?.files[0];if(!t&&!f)return toast('Введіть текст або оберіть файл',1);
  act('send',async()=>{const pl={content:t||undefined,username:(D.m_user||a.nick||'').trim()||undefined,avatar_url:(D.m_av||a.avatar||'').trim()||undefined};
   let j;if(f){const fd=new FormData();fd.append('payload_json',JSON.stringify(pl));fd.append('files[0]',f,f.name);j=await xhrSend(a.url+'?wait=true',fd,'send')}
   else{const r=await fetch(a.url+'?wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)});if(!r.ok)throw new Error(await apiErr(r));j=await r.json()}
   S.lastId=j.id||'';D.m_text='';toast('Повідомлення відправлено')})},
 edit_msg(){const a=need();if(!a)return;const id=(D.e_id||'').trim(),t=(D.e_text||'').trim();if(!id)return toast('Введіть ID повідомлення',1);if(!idOk(id))return toast('ID повідомлення має складатися лише з цифр',1);if(!t)return toast('Введіть новий текст',1);
  act('edit',async()=>{const r=await fetch(a.url+'/messages/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:t})});if(!r.ok)throw new Error(await apiErr(r));toast('Повідомлення змінено')})},
 del_msg(){const a=need();if(!a)return;const id=(D.d_id||'').trim();if(!id)return toast('Введіть ID повідомлення',1);if(!idOk(id))return toast('ID повідомлення має складатися лише з цифр',1);if(!confirm('Видалити повідомлення '+id+'? Це незворотно.'))return;
  act('del',async()=>{const r=await fetch(a.url+'/messages/'+id,{method:'DELETE'});if(!r.ok)throw new Error(await apiErr(r));toast('Повідомлення видалено')})},
 send_img(){const a=need();if(!a)return;const f=$('#f_img')?.files[0],u=(D.i_url||'').trim();if(!f&&!u)return toast('Вкажіть Image URL або оберіть фото',1);if(!f&&!/^https?:\/\//i.test(u))return toast('Некоректний Image URL',1);
  act('img',async()=>{const pl={content:(D.i_text||'').trim()||undefined,username:a.nick||undefined,avatar_url:a.avatar||undefined};
   if(f){const fd=new FormData();fd.append('payload_json',JSON.stringify(pl));fd.append('files[0]',f,f.name);const j=await xhrSend(a.url+'?wait=true',fd,'img');S.lastId=j.id||''}
   else{pl.embeds=[{image:{url:u}}];const r=await fetch(a.url+'?wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)});if(!r.ok)throw new Error(await apiErr(r));S.lastId=(await r.json()).id||''}
   toast('Фото відправлено')})},
 codepick(id){S.codeHook=id;S.view='code';render()},codechange(){S.codeHook=null;render()},
 file(id){S.file=id;render()},vcode(){S.view='code';render()},vprev(){codeSync();S.view='prev';render()},vprev2(){ACT.vprev()},
 run(){codeSync();save();S.view='prev';render();toast('Запущено')},
 csave(){codeSync();save();toast('Збережено')},
 cclear(){if(!confirm('Очистити '+S.file+'?'))return;S.code[S.file]='';save();render()},
 export(){const b=new Blob([JSON.stringify({hooks:S.hooks,code:S.code},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='webhook-hub.json';a.click()},
 wipe(){if(!confirm('Стерти всі локальні дані?'))return;Object.keys(localStorage).filter(k=>k.startsWith('dwh.')).forEach(k=>localStorage.removeItem(k));location.reload()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;if(b.classList.contains('modal')&&e.target!==b)return;const f=ACT[b.dataset.a];if(f)try{f(b.dataset.id)}catch(x){toast(x.message,1)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)D[k]=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='codeta'&&e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText('  ',s,t.selectionEnd,'end')}});
/* offline */
function net(){$('#off').classList.toggle('show',!navigator.onLine)}
addEventListener('online',net);addEventListener('offline',net);$('#retry').onclick=()=>{net();if(navigator.onLine)toast('З’єднання відновлено')};net();
/* PWA manifest (inline) */
try{const m={name:'Discord Webhook Hub',short_name:'Webhook Hub',display:'standalone',background_color:'#1e1f22',theme_color:'#1e1f22',start_url:'.'};const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l)}catch(e){}
render();
</script></body></html>
